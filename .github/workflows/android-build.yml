name: Build Battle Royale APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o BattleRoyale_GitHub_Ready.zip
          cd BattleRoyale_Dingana26_APK_Project
          ls -la

      - name: Build APK
        working-directory: BattleRoyale_Dingana26_APK_Project
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyale-debug-apk
          path: BattleRoyale_Dingana26_APK_Project/app/build/outputs/apk/debug/app-debug.apk
