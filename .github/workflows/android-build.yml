name: Inspect Battle Royale ZIP

on: [push]

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP and inspect
        run: |
          unzip -o BattleRoyale_GitHub_Ready.zip
          echo "===== PROJECT STRUCTURE ====="
          find BattleRoyale_Dingana26_APK_Project -maxdepth 4 -type f | sort
